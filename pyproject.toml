[project]
name = "cityflow"
version = "0.1.0"
description = "Hệ giám sát giao thông đô thị dựa trên truy vấn cửa sổ trượt và khai phá mẫu đồng ùn tắc"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "sqlalchemy",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "mlxtend", "matplotlib", "pyshp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
